name: TFT50 package tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler patch
      - run: python3 -m unittest discover -s tests -v
      - run: |
          sh -n target/sbc/radxa_dragon_q6a/setup.sh
          sh -n target/sbc/radxa_dragon_q6a/deploy.sh
